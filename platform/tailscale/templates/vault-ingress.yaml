{{- if .Values.vault.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  name: https
  tls:
  - hosts:
    - {{ if .Values.developmentApp.enabled }}dev-vault-my-cluster{{ else }}vault-my-cluster{{ end }}
{{- end }}
