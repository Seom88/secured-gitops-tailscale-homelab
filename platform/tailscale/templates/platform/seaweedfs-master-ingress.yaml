{{- if .Values.seaweedfs.master.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-master
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-master-tailscale
                port:
                  number: 9333
  tls:
    - hosts:
        - {{ if .Values.developmentApp.enabled }}dev-seaweedfs-master{{- else }}seaweedfs-master{{- end }}
{{- end }}
