{{- if .Values.seaweedfs.filer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer-tailscale
  namespace: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: filer
    app.kubernetes.io/instance: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: filer
    app.kubernetes.io/instance: seaweedfs
  ports:
    - name: swfs-filer
      port: 8888
      protocol: TCP
      targetPort: 8888
{{- end }}
