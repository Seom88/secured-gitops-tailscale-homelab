{{- if .Values.seaweedfs.filer.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-filer
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.developmentApp.enabled }}seaweedfs-dev-filer{{- else }}seaweedfs-filer{{- end }}
                port:
                  number: 8888
  tls:
    - hosts:
        - {{ if .Values.developmentApp.enabled }}dev-seaweedfs-filer{{- else }}seaweedfs-filer{{- end }}
{{- end }}
