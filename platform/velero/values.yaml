ciliumNetworkPolicy:
  enabled: true

# S3 backend — single source for the URL: CI (GitHub Vars S3_ENDPOINT).
# Flow: vars.S3_ENDPOINT -> deploy.yaml env -> init-gitops.sh --set veleroS3.tailnetFqdn
# -> ArgoCD Application helm.parameter s3.tailnetFqdn.
# tailnetFqdn is REQUIRED (empty on purpose — Service, bucket-init Job,
# CiliumNetworkPolicy and BackupStorageLocation fail loudly via `required` when unset).
# The informational ConfigMap velero/s3-endpoint is CI-owned
# (.github/workflows/deploy.yaml) and is NOT templated here.
# Do NOT put a URL literal here: a stale literal would silently win over CI.
# bucket/prefix/region are chart-owned (identical in every env except prefix):
# S3_BUCKET in CI is the Terraform-state bucket, NOT this one — never wire it here.
s3:
  tailnetFqdn: ""
  bucket: velero-homelab
  prefix: velero
  region: us-east-1
  hostname: velero-s3-egress

developmentApp:
  enabled: false

# Velero subchart wrapper — all keys under `velero` map to vmware-tanzu/velero chart.
velero:
  enabled: true

  # RBAC — ServiceAccount used by Velero server and node-agent.
  serviceAccount:
    server:
      create: true
      name: velero

  # AWS plugin — required for the S3-compatible backend.
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.2
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  configuration:
    # BackupStorageLocation — owned by THIS wrapper chart
    # (templates/backupstoragelocation.yaml), NOT by the upstream subchart:
    # upstream reads s3Url literally from values (no templating), and neither
    # helm --set nor ArgoCD parameters can patch a single array entry by index
    # (lists are replaced wholesale — a [0] patch would drop provider/bucket and
    # fail upstream schema validation). Empty list = upstream creates no BSL.
    backupStorageLocation: []
    # VolumeSnapshotLocation — not used (Longhorn snapshots via FsBackup), but chart requires at least one entry.
    volumeSnapshotLocation:
      - name: default
        provider: aws
        config:
          region: us-east-1
    # General behaviour
    snapshotVolumes: false
    defaultVolumesToFsBackup: true
    backupSyncPeriod: 1m
    restoreOnlyMode: false
    # UI: keep default 60s.
    # Features: CSI if available (empty = defaults). Must NOT be a literal string.
    features: ""

  # Credentials — the Secret `cloud-credentials` is created by bootstrap/init-gitops.sh
  # (chicken-egg: Velero cannot use ESO/Vault because Vault itself is backed up).
  # Format expected by the chart: key `cloud` = "[default]\naws_access_key_id=...\naws_secret_access_key=...\n"
  credentials:
    existingSecret: cloud-credentials
    useSecret: true

  # SnapshotsEnabled — enables VolumeSnapshot handling (kept true for future CSI).
  snapshotsEnabled: true

  deployNodeAgent: true

  # NodeAgent (formerly restic) — required for PVC filesystem backup (Longhorn volumes).
  nodeAgent:
    enabled: true

  # Schedules — default Schedules installed at deploy time.
  # ArgoCD prune protection: Backups created by these Schedules are extraneous
  # for ArgoCD (velero.io group) — annotations propagate Schedule -> Backup
  # (velero docs: backup-reference). Keeps ArgoCD from pruning day-2 Backups.
  # useOwnerReferencesInBackup=false is intentional (true would delete Backups
  # when the Schedule changes/deletes).
  schedules:
    daily-full:
      disabled: false
      schedule: "0 2 * * *"
      useOwnerReferencesInBackup: false
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: Prune=false
      template:
        ttl: 720h
        includedNamespaces:
          - "*"
        excludedNamespaces:
          - velero
          - kube-system
          - kube-public
          - kube-node-lease
          - longhorn-system
          # Vault is NEVER backed up by Velero (policy): Raft restores from
          # Velero corrupt the cluster. DR is re-bootstrap via
          # platform/vault/scripts/bootstrap-vault.sh (init if
          # initialized==false, unseal, kv-v2 + k8s auth) + secret rotation.
          # Hourly crash-consistency comes from Longhorn local snapshots.
          - vault
          # GitOps control-plane (other repo: infra-talos-homelab,
          # argocd_namespace=argocd, cilium_namespace=kube-system).
          # ArgoCD is source-of-truth in Git — reinstall, never restore.
          # Cilium CNI lives in kube-system (already excluded) but its
          # cluster-scoped runtime CRDs need excludedResources below.
          - argocd
        excludedResources:
          - replicas.longhorn.io
          - engines.longhorn.io
          - nodes.longhorn.io
          # ArgoCD control-plane — Git is source of truth, never restore.
          - applications.argoproj.io
          - appprojects.argoproj.io
          - applicationsets.argoproj.io
          # Cilium runtime churn — ephemeral identities/endpoints, re-created
          # by the agent. Restoring stale identities breaks networking.
          # (Policies themselves are Git-managed; only runtime state excluded.)
          - ciliumidentities.cilium.io
          - ciliumendpoints.cilium.io
          - ciliumendpointslices.cilium.io
          # Volatile / derived resources — noise, never restore.
          # (Community consensus: velero discussion #9146, e-whisper filtering guide.)
          - events
          - events.events.k8s.io
          - endpointslices.discovery.k8s.io
          - controllerrevisions.apps
          # Short-lived cert-manager ACME objects — re-issued on demand.
          - challenges.acme.cert-manager.io
          - orders.acme.cert-manager.io
          # Velero's own objects — live in velero ns (already excluded),
          # belt-and-braces so a label-selector backup never grabs them.
          - backups.velero.io
          - restores.velero.io
          - schedules.velero.io
        storageLocation: default
        volumeSnapshotLocations:
          - default
        defaultVolumesToFsBackup: true
    # vault-hourly — DISABLED by policy: nothing of Vault is stored in Velero.
    # Raft snapshot restores via Velero corrupt the cluster; DR is re-bootstrap
    # (platform/vault/scripts/bootstrap-vault.sh) + rotation, not restore.
    # Hourly protection for Vault is a Longhorn local snapshot RecurringJob
    # (platform/longhorn/templates/recurringjobs.yaml). Kept here disabled as
    # documentation of the retired schedule — do not re-enable.
    vault-hourly:
      disabled: true
      schedule: "0 * * * *"
      useOwnerReferencesInBackup: false
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: Prune=false
      template:
        ttl: 168h
        includedNamespaces:
          - vault
        # RETIRED — kept for reference only (schedule disabled above).
        # NOTE: ClusterSecretStore is cluster-scoped, covered by daily-full, not this namespaced schedule.
        # NOTE: defaultVolumesToFsBackup=false was intentional when active —
        # hourly covered manifests only; Raft data (PVC) was covered by
        # daily-full with FsBackup=true. Both are retired: Vault is excluded.
        includedResources:
          - secrets
          - configmaps
          - persistentvolumeclaims
          - cronjobs
          - deployments
          - statefulsets
          - jobs
          - serviceaccounts
          - roles
          - rolebindings
          - issuers.cert-manager.io
          - certificates.cert-manager.io
        storageLocation: default
        defaultVolumesToFsBackup: false

  # Resource requests — conservative homelab defaults.
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: monitoring

  # UpgradeCRDs — install Velero CRDs via Helm.
  upgradeCRDs: true
  cleanUpCRDs: false
