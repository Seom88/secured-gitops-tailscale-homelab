{{- if .Values.velero.enabled }}
# BackupStorageLocation owned by this wrapper chart (NOT the upstream subchart):
# upstream reads s3Url literally from values (no templating), and neither
# `helm --set` nor ArgoCD parameters can patch one array entry by index
# (lists are replaced wholesale — a [0] patch drops provider/bucket and fails
# upstream schema validation). Upstream BSL is disabled via
# `velero.configuration.backupStorageLocation: []` in values.yaml.
# URL note (delegated-direct): s3Url points at the in-cluster tailscale
# s3-egress Service via kube-dns — never the MagicDNS FQDN (its public-IP
# fallback dies in TLS EOF). insecureSkipTLSVerify stays true: the internal
# Service name never matches the RustFS LE cert. s3.tailnetFqdn plumbing is
# still required by the ts-operator s3-egress Service + Cilium policies.
# Bucket/prefix/region are chart-owned in s3.* (S3_BUCKET in CI is the
# Terraform-state bucket — never the Velero bucket).
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/part-of: velero
spec:
  provider: aws
  accessMode: ReadWrite
  objectStorage:
    bucket: {{ .Values.s3.bucket | quote }}
    prefix: {{ .Values.s3.prefix | quote }}
  config:
    region: {{ .Values.s3.region | quote }}
    s3ForcePathStyle: "true"
    s3Url: "https://s3-egress.tailscale.svc.cluster.local"
    insecureSkipTLSVerify: "true"
{{- end }}
