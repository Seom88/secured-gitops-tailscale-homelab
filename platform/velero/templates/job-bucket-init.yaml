{{- if .Values.velero.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: velero-bucket-init
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/hook-weight: "-1"
    # Keep Job after success so Argo does not prune it and logs remain inspectable.
    # ttlSecondsAfterFinished will GC it after 600s.
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero-bucket-init
        app.kubernetes.io/component: bucket-init
    spec:
      # Use `default` SA to avoid chicken-egg with velero SA (created by subchart in same release).
      # The Job only needs to mount the Secret; no RBAC beyond that is required.
      # If you need custom RBAC, create a dedicated SA and reference it here.
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[bucket-init] Starting RustFS bucket init..."
              CRED_FILE="/etc/velero/cloud"
              # Wait up to 60s for Secret volume to appear (optional:true + race with ensureVeleroCredentials)
              WAIT_SECS=0
              WAIT_MAX=60
              while [ ! -f "$CRED_FILE" ] && [ $WAIT_SECS -lt $WAIT_MAX ]; do
                echo "[bucket-init] Waiting for credentials file $CRED_FILE ($WAIT_SECS/$WAIT_MAX s)..."
                sleep 5
                WAIT_SECS=$((WAIT_SECS + 5))
              done
              if [ ! -f "$CRED_FILE" ]; then
                echo "[bucket-init] ERROR: credentials file not found at $CRED_FILE (Secret velero/cloud-credentials missing?)"
                echo "[bucket-init] Hint: ensure bootstrap/init-gitops.sh ensureVeleroCredentials() ran with VELERO_AWS_* or AWS_*."
                exit 1
              fi
              # Velero secret format: "[default]\naws_access_key_id=...\naws_secret_access_key=..."
              # Parse with grep/cut, strip spaces.
              export AWS_ACCESS_KEY_ID="$(grep -E 'aws_access_key_id' "$CRED_FILE" | cut -d'=' -f2 | tr -d '[:space:]')"
              export AWS_SECRET_ACCESS_KEY="$(grep -E 'aws_secret_access_key' "$CRED_FILE" | cut -d'=' -f2 | tr -d '[:space:]')"
              export AWS_DEFAULT_REGION="us-east-1"
              ENDPOINT="https://rustfs.lonk-mirfak.ts.net"
              BUCKET="velero-homelab"
              if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
                echo "[bucket-init] ERROR: could not parse credentials from $CRED_FILE"
                echo "[bucket-init] File content (sanitized):"
                sed 's/=.*/=***/' "$CRED_FILE" || cat "$CRED_FILE" || true
                exit 1
              fi
              echo "[bucket-init] Creating bucket $BUCKET at $ENDPOINT (region $AWS_DEFAULT_REGION)..."

              # RustFS via Tailscale funnel uses a Tailscale-issued cert not in public CA bundle.
              # The aws-cli container has no Tailscale CA, so skip TLS verify (same as Velero's insecureSkipTLSVerify).
              AWS_S3_EXTRA="--no-verify-ssl"

              set +e
              OUTPUT="$(aws s3api create-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" $AWS_S3_EXTRA 2>&1)"
              RC=$?
              set -e
              echo "$OUTPUT"
              if [ $RC -eq 0 ]; then
                echo "[bucket-init] Bucket created successfully."
              else
                if echo "$OUTPUT" | grep -qiE 'BucketAlreadyOwnedByYou|BucketAlreadyExists|already exists'; then
                  echo "[bucket-init] Bucket already exists — continuing (idempotent)."
                else
                  echo "[bucket-init] ERROR: create-bucket failed with exit $RC"
                  exit $RC
                fi
              fi

              echo "[bucket-init] Verifying bucket with head-bucket..."
              aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" $AWS_S3_EXTRA
              echo "[bucket-init] Verification OK — bucket $BUCKET is accessible."
              # Optional: list to confirm write permission (non-fatal).
              aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" $AWS_S3_EXTRA || true
              echo "[bucket-init] Done."
          volumeMounts:
            - name: cloud-credentials
              mountPath: /etc/velero
              readOnly: true
      volumes:
        - name: cloud-credentials
          secret:
            secretName: cloud-credentials
            optional: true
            items:
              - key: cloud
                path: cloud
{{- end }}
