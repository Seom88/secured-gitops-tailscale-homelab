# Dev overlay. S3 endpoint: same single source as prod
# (gitops/values-dev.yaml veleroS3.tailnetFqdn) — intentionally empty here; required at render time. Only prefix/hostname differ
# (bucket/region inherit from values.yaml); the BackupStorageLocation CR is built
# by templates/backupstoragelocation.yaml from s3.* (no BSL block here).
s3:
  hostname: velero-s3-egress-dev
  prefix: velero-dev
  tailnetFqdn: ""

velero:
  # Dev sizing: full requests/limits for parallel volume backups; prod stays lean.
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

developmentApp:
  enabled: true
