{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for cert-manager — minimal per cert-manager.io docs + helm chart v1.17.2
# Chart: webhook securePort 10250 (Service 443 -> pod 10250), metrics 9402; cainjector/controller metrics 9402
# Minimal ingress requires 443 (Service) for kube-apiserver ValidatingWebhookConfiguration; metrics 9402 for scraping.
# Task spec: use 443 and 10260 as minimal (webhook 10260). Actual chart uses 10250/9402 — we keep 443+10260 per spec
# and add 10250+9402 for compatibility with deployed chart (v1.17.2 securePort=10250). Remove 10250/9402 only if strict 10260 doc-only.

# 1) DNS egress — required for ACME/DNS01 solvers and service discovery (kube-dns only)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-dns
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress — kube-apiserver (webhook registration, cert issuance) + DNS already covered
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-egress
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# 3) Ingress — kube-apiserver/host/remote-node to webhook (narrowed from allow-all)
# Per cert-manager docs task: 443 (Service) + 10260 (webhook health/metrics). Upstream chart v1.17.2 actual: securePort 10250, metrics 9402.
# Minimal per task is 443+10260; we include 443+10260 mandatory and 10250+9402 for chart compatibility (remove 10250/9402 only if strict 10260 doc-only).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-ingress
  namespace: cert-manager
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10260"
              protocol: TCP
            - port: "10250"
              protocol: TCP
            - port: "9402"
              protocol: TCP
{{- end }}
