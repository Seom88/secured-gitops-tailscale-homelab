# Production values — modular mode (separate StatefulSets)
seaweedfs:
  master:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    data:
      type: "existingClaim"
      claimName: "seaweedfs-master-data"
    logs:
      type: "emptyDir"

  volume:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 96Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    dataDirs:
      - name: data1
        type: "persistentVolumeClaim"
        size: "26Gi"
        storageClass: ""
        maxVolumes: 0
    logs:
      type: "emptyDir"

  filer:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    data:
      type: "persistentVolumeClaim"
      size: "5Gi"
      storageClass: ""
    logs:
      type: "emptyDir"

  # Standalone S3 Deployment (do NOT use filer.s3.enabled — nil pointer dereference bug)
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: seaweedfs-s3-credentials
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    logs:
      type: "emptyDir"

  # Admin UI — consolidated management console
  admin:
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    secret:
      # Credentials come from Vault → ESO (see templates/external-secret.yaml)
      existingSecret: seaweedfs-admin-credentials
      userKey: adminUser
      pwKey: adminPassword
    # Persist maintenance config (vacuum/balance/EC thresholds) across restarts
    data:
      type: persistentVolumeClaim
      size: "1Gi"
      storageClass: ""

  allInOne:
    enabled: false

ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false
