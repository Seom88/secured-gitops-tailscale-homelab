apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-credentials
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-seaweedfs
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: seaweedfs_s3_config
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None	
        key: "secret/seaweedfs/s3"
        metadataPolicy: None	
        nullBytePolicy: Ignore
        property: "s3_config"
---
# Admin UI credentials (weed admin) — separate from S3 credentials: the admin
# server authenticates with user/password (session-based), not S3 access keys.
# Same Vault path prefix (secret/seaweedfs/*) and same ClusterSecretStore, so
# everything stays centralized under the seaweedfs-policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-admin-credentials
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-seaweedfs
    kind: ClusterSecretStore
  target:
    name: seaweedfs-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: adminUser
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "secret/seaweedfs/admin"
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: "admin_user"
    - secretKey: adminPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "secret/seaweedfs/admin"
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: "admin_password"
