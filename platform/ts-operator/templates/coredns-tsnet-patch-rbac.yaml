# RBAC for the ts.net CoreDNS reconciler (script ConfigMap + Job + CronJob
# in templates/coredns-tsnet-patch.yaml). Narrow by construction:
# - kube-system Role touches ONLY the `coredns` ConfigMap (resourceNames)
#   with get (read Corefile + resourceVersion) and patch (field-scoped
#   data.Corefile write). `update` is retained for kubectl clients that
#   negotiate the write verb set, but the script only ever issues PATCH.
# - The same Role may ONLY get+patch the `coredns` Deployment: the minimum
#   verbs `kubectl rollout restart` needs (GET then PATCH the pod-template
#   annotation). No other workloads, no scale, no delete.
# - ClusterRole only READS the singleton DNSConfig status.
# - No create/delete on ConfigMaps (a missing CoreDNS ConfigMap fails loudly
#   in the script instead of being recreated from a hardcoded Corefile).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-tsnet-patch
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coredns-tsnet-patch
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["coredns"]
    verbs: ["get", "update", "patch"]
  # Documented activation path: `kubectl rollout restart
  # deployment/coredns -n kube-system` performs a GET followed by a PATCH of
  # the pod-template annotation. Scoped to resourceNames [coredns]; when the
  # restart is unavailable the script falls back to the reload plugin.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["coredns"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coredns-tsnet-patch
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: coredns-tsnet-patch
    namespace: tailscale
roleRef:
  kind: Role
  name: coredns-tsnet-patch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-tsnet-patch-dnsconfig
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["tailscale.com"]
    resources: ["dnsconfigs", "dnsconfigs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-tsnet-patch-dnsconfig
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: coredns-tsnet-patch
    namespace: tailscale
roleRef:
  kind: ClusterRole
  name: coredns-tsnet-patch-dnsconfig
  apiGroup: rbac.authorization.k8s.io
