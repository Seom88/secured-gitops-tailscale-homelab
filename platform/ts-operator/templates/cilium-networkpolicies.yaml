{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for tailscale namespace — operator + Ingress proxies
# ADR-014: Cilium v1.20.1 kubeProxyReplacement=strict enforces identity; Flannel ignored mismatches.

# 1) DNS
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-dns
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress — kube-apiserver + Tailscale control plane (443) + DNS + webhook to kubelets
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-egress
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Tailscale control plane — plain world egress (no DNS L7 on world; DNS already allowed via kube-dns)
    # Tailscale NAT traversal — STUN (3478/udp, 80/tcp) + ICMP path MTU (Hubble drop fix 2026-09-04)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "80"
              protocol: TCP
            - port: "41641"
              protocol: UDP
            - port: "41641"
              protocol: TCP
    # ICMP Echo for Tailscale PMTU — CRD 1.33.11 requires icmps[].fields[].type (bare family is invalid)
    - toEntities:
        - world
      icmps:
      - fields:
        - family: IPv4
          type: 8
        - family: IPv4
          type: 0
        - family: IPv6
          type: 128
        - family: IPv6
          type: 129
    - toFQDNs:
        - matchName: controlplane.tailscale.com
        - matchPattern: "*.controlplane.tailscale.com"
        - matchPattern: "*.tailscale.com"
        - matchPattern: "*.ts.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "41641"
              protocol: UDP
    # Proxies forward to in-cluster services (operator creates Service per Ingress) — allow to cluster
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8200"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # Optional — mDNS/SSDP host discovery (10.244.0.131:5351, 239.255.255.250:1900) intentionally blocked;
    # uncomment to silence Hubble if needed (host only, not world):
    # - toEntities:
    #     - host
    #   toPorts:
    #     - ports:
    #         - port: "5351"
    #           protocol: UDP
    #         - port: "1900"
    #           protocol: UDP
    # Hubble
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
# 3) Ingress — API server webhook + host probes + hubble
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-ingress
  namespace: tailscale
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "9443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Operator / proxy intra-namespace — SAME namespace as operator (tailscale), namespace-only match
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
{{- end }}
