developmentApp:
  enabled: false

# Configuration for the Loki subchart
loki:
  # Deployment mode: SingleBinary (simple), SimpleScalable (medium), Distributed (large)
  deploymentMode: SingleBinary

  # Number of replicas
  singleBinary:
    replicas: 1
    persistence:
      size: 5Gi
      storageClass: ""
    # Inject SeaweedFS S3 credentials from Vault via ESO
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

  # Component replicas (set to 0 for Monolithic mode)
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  # Caching
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Helm test
  test:
    enabled: false

  # Loki application configuration
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Disable test schema to use our custom schemaConfig
    useTestSchema: false

  # Enable gateway (default is true, but we ensure it)
  gateway:
    enabled: true
    service:
      port: 80
      type: ClusterIP

# Configuration for the Kube-Prometheus-Stack subchart
kube-prometheus-stack:
  # Grafana configuration
  grafana:
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password

    # Single-host gateway subpath — ADR-012: Grafana served at /grafana via my-cluster.lonk-mirfak.ts.net
    grafana.ini:
      server:
        domain: my-cluster.lonk-mirfak.ts.net
        root_url: https://my-cluster.lonk-mirfak.ts.net/grafana/
        serve_from_sub_path: true

    # Add Loki as a data source
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki-gateway.monitoring.svc.cluster.local/
        access: proxy
        # Even with auth_enabled: false, Loki requires an org ID header
        # This is a known quirk - the value can be anything since auth is disabled
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "fake"

    sidecar:
      dashboards:
        searchNamespace: monitoring

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    livenessProbe:
      initialDelaySeconds: 90
    readinessProbe:
      initialDelaySeconds: 20
      timeoutSeconds: 5

    # Native Ingress configuration for Grafana
    ingress:
      enabled: false
      ingressClassName: tailscale
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      hosts:
        - grafana
      tls:
        - hosts:
            - grafana

  # Prometheus persistent storage & native Ingress:
  prometheus:
    prometheusSpec:
      scrapeInterval: "60s"
      evaluationInterval: "60s"
      retention: 7d
      retentionSize: 15GB
      # Single-host gateway subpath — ADR-012
      externalUrl: https://my-cluster.lonk-mirfak.ts.net/prometheus
      routePrefix: /prometheus
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1536Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi

    # Native Ingress configuration for Prometheus
    ingress:
      enabled: false
      ingressClassName: tailscale
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      hosts:
        - prometheus
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - prometheus

  # Alertmanager configuration:
  alertmanager:
    alertmanagerSpec:
      replicas: 1

# Grafana Alloy — single log shipper for Loki (replaces Promtail by design decision)
# Alloy is stateless DaemonSet tailing via Kubernetes API (loki.source.kubernetes).
# It needs NO PVC/storage (WAL disabled by default, uses /tmp/alloy which is ephemeral).
# RBAC (ServiceAccount + ClusterRole/ClusterRoleBinding for pods/nodes discovery) is
# created automatically by the alloy chart (rbac.create=true, default). No manual RBAC needed.
# Grafana Alloy — log shipper for Loki
# Deployed as a DaemonSet: discovers local pods via discovery.kubernetes, filters to own node,
# tails /var/log/pods host mount via loki.source.kubernetes, and forwards to Loki gateway.
ciliumNetworkPolicy:
  enabled: true

alloy:
  # Pass-through to alloy subchart (Helm: parent key `alloy` nests all alloy chart values)
  alloy:
    mounts:
      varlog: true
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        // 1. Discover all pods in the cluster
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // 2. Filter to only pods running on the current node (K8S_NODE_NAME injected by Helm)
        discovery.relabel "local_pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            regex         = sys.env("K8S_NODE_NAME")
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        // 3. Drop noisy probe logs before pushing
        loki.process "drop_noise" {
          forward_to = [loki.write.grafana_loki.receiver]

          stage.drop {
            expression = ".*(kube-probe|healthz|livez|readyz).*"
            drop_counter_reason = "healthcheck_noise"
          }
        }

        // 4. Collect logs from /var/log/pods on the node
        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.write.grafana_loki.receiver]
          targets    = discovery.relabel.local_pods.output
          forward_to = [loki.process.drop_noise.receiver]
        }

        // 5. Send logs to Loki Gateway
        loki.write "grafana_loki" {
          endpoint {
            url = "http://monitoring-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "fake",
            }
          }
        }
  controller:
    type: daemonset
  # Optional: keep default serviceAccount.create=true, rbac.create=true (auto)
  # No mounts.varlog / dockercontainers needed — loki.source.kubernetes uses the API, not host filesystem.
