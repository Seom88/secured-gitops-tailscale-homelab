{{- if not (eq (index .Values "kube-prometheus-stack" "enabled") false) }}
# SeaweedFS ServiceMonitors managed by monitoring chart.
# This eliminates the chicken-and-egg dependency where SeaweedFS cannot install
# ServiceMonitors before Prometheus Operator CRDs are applied by the monitoring chart.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seaweedfs-master
  namespace: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: master
    release: monitoring
spec:
  endpoints:
    - interval: 60s
      port: metrics
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: master
---
