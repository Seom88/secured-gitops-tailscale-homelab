developmentApp:
  enabled: true

# Loki S3 endpoint — unified service name (no -dev suffix after ADR-012 simplification)
loki:
  loki:
    storage:
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc:8333

# Configuration for the Kube-Prometheus-Stack subchart — dev single-node tuning (16GB host, 6GB VM)
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      externalUrl: https://dev-my-cluster.lonk-mirfak.ts.net/prometheus
      routePrefix: /prometheus
      retention: 2d
      retentionSize: 5GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { cpu: 1000m, memory: 1Gi }
  alertmanager:
    alertmanagerSpec:
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 100m, memory: 128Mi }
  grafana:
    grafana.ini:
      server:
        domain: dev-my-cluster.lonk-mirfak.ts.net
        root_url: https://dev-my-cluster.lonk-mirfak.ts.net/grafana/
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
    persistence: { enabled: false }
