apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-autounseal
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-autounseal
    app.kubernetes.io/component: operations
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-autounseal
            app.kubernetes.io/component: operations
        spec:
          serviceAccountName: vault-autounseal
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

          containers:
            - name: autounseal
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent

              command: ["/bin/sh", "/scripts/unseal.sh"]

              env:
                - name: VAULT_NAMESPACE
                  value: "vault"
                - name: VAULT_TLS_SERVER_NAME
                  value: "vault"

              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

          volumes:
            - name: script
              configMap:
                name: vault-autounseal-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
