{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for vault — complement to Helm-managed K8s NetworkPolicies (vault Helm: server + injector NPs)
# Adds Hubble visibility + Cilium DNS-aware + explicit allow for ExternalSecretsOperator.
# ADR-014: Cilium kubeProxyReplacement=strict enforces these; Flannel ignored mismatches.

# 1) Hubble-aware DNS (mirrors Helm NP but Cilium-aware)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-allow-dns-cilium
  namespace: vault
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress complement — Hubble, ESO, and Vault replication
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-allow-egress-cilium
  namespace: vault
spec:
  endpointSelector: {}
  egress:
    # Vault API 8200 within vault namespace — already in Helm NP, mirrored here Cilium-native
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # ExternalSecretsOperator -> Vault
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Hubble
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
# 3) Ingress complement — Hubble + dedicated Tailscale device (vault-my-cluster)
# Cilium strict: Tailscale Ingress proxy pods live in SAME namespace as Ingress (vault), NOT in tailscale-operator.
# Flannel ignored namespace mismatches; Cilium blocks. Previous rule whitelisting tailscale-operator NEVER matched.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-allow-ingress-cilium
  namespace: vault
spec:
  endpointSelector: {}
  ingress:
    # intra-vault narrowed from allow-all: Vault API 8200 only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Vault dedicated Tailscale Ingress proxy — SAME namespace as Ingress (vault), namespace-only match
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # entity ingress narrowed from allow-all: Vault API 8200 only
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
{{- end }}
