developmentApp:
  enabled: true

# vaultAddress — unified service name (no -dev suffix after ADR-012)
vaultAddress: "https://vault.vault.svc:8200"

vault:
  injector:
    replicas: 1
    affinity: ""
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
  server:
    affinity: ""
    # Dev sizing: full requests/limits for rich metrics and to catch
    # throttling/OOM pressure in dev before prod.
    resources:
      requests: { cpu: 500m, memory: 256Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    ha:
      enabled: true
      replicas: 1
    # Persistent storage
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: ""

    auditStorage:
      enabled: true
      size: 1Gi
      storageClass: ""

tailscaleIngress:
  vault:
    hostname: vault-dev
