developmentApp:
  enabled: true

# vaultAddress — unified service name (no -dev suffix after ADR-012)
vaultAddress: "https://vault.vault.svc:8200"

vault:
  server:
    # Persistent storage
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: ""

    auditStorage:
      enabled: true
      size: 1Gi
      storageClass: ""
