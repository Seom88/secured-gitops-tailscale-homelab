{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for trivy-operator — scoped allowlist.
# Upstream chart ships no NetworkPolicy; this mirrors the repo pattern
# (velero/monitoring): separate DNS doc, port-scoped egress/ingress docs,
# toFQDNs always paired with inline rules.dns in the same rule.
# Notes:
# - Namespace `trivy-system` is hardcoded following the repo pattern.
# - endpointSelector {} is intentional: scan Jobs share this namespace with
#   varying job labels (operator pods carry app.kubernetes.io/name=trivy-operator,
#   scan jobs do not), so a narrow selector would leave scan jobs uncovered.
# - Webhook is disabled upstream (webhookBroadcastURL=""), so no ingress
#   from kube-apiserver is opened.
# - Pod ports: metrics 8080, probes 9090 (Service 80 maps to targetPort
#   `metrics` = 8080; Cilium enforces at pod level, so pod ports apply).

# 1) DNS (standard, same as velero/monitoring)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-allow-dns-cilium
  namespace: trivy-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress — kube-apiserver + explicit registry allowlist + scoped intra-cluster.
# Scan jobs pull the Trivy DB (ghcr.io) and scanned images (ghcr.io, docker.io).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-allow-egress-cilium
  namespace: trivy-system
spec:
  endpointSelector: {}
  egress:
    # Operator watch/listing against the API server.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Trivy DB + container images via ghcr.io.
    - toFQDNs:
        - matchName: ghcr.io
        - matchPattern: "*.ghcr.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: ghcr.io
              - matchPattern: "*.ghcr.io"
    # Trivy DB release assets.
    - toFQDNs:
        - matchName: pkg-containers.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: pkg-containers.githubusercontent.com
    # Scanned public images via Docker Hub.
    - toFQDNs:
        - matchName: docker.io
        - matchPattern: "*.docker.io"
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: docker.io
              - matchPattern: "*.docker.io"
              - matchPattern: registry-1.docker.io
              - matchPattern: auth.docker.io
    # Default image pull-through mirror (chart default image.registry).
    - toFQDNs:
        - matchName: mirror.gcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: mirror.gcr.io
    # Intra-cluster + node-scoped HTTPS (node-collector footprint,
    # in-cluster services). Port-scoped — refine via Hubble if flows show
    # additional ports.
    - toEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# 3) Ingress — Prometheus scraping (monitoring) + kubelet probes (host).
# No cluster-wide entity, no kube-apiserver ingress (webhook disabled).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-allow-ingress-cilium
  namespace: trivy-system
spec:
  endpointSelector: {}
  ingress:
    # Prometheus scraping the operator metrics endpoint (pod port 8080).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet liveness/readiness probes (9090) + host-level scrape (8080).
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
{{- end }}
