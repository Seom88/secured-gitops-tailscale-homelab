ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# Hybrid gateway — 2 Tailscale devices: my-cluster (gateway for 5 services) + vault-my-cluster (Vault dedicated via vault-ingress.yaml).
# See ADR-012 + Amendment 2026-09-02 (Vault moved off gateway due to no subpath support). Each gateway location gated by enabled toggle below.
hostname: my-cluster
gateway:
  enabled: true  # set false to disable the my-cluster gateway device; vault device controlled by vault.enabled below
  replicas: 1
  image:
    # Digest-pinned (fail-closed Trivy gate): refresh with
    # skopeo inspect docker://nginx:<tag> | jq -r .Digest
    # Tag stays for Renovate (docker datasource bumps tag+digest together).
    repository: nginx
    tag: "1.31-alpine"
    digest: "sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de"
    pullPolicy: IfNotPresent
  # Lean homelab sizing (prod): data-plane nginx is mostly idle; minimal
  # request keeps it schedulable while the limit holds burst headroom.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Per-service toggles — argocd/grafana/prometheus/longhorn/seaweedfs control gateway ConfigMap locations.
# vault.enabled controls the dedicated vault-my-cluster Tailscale device (vault-ingress.yaml), not a gateway location.
homepage:
  enabled: true

argocd:
  enabled: true

vault:
  enabled: true  # dedicated device vault-my-cluster.lonk-mirfak.ts.net (dev: dev-vault-my-cluster); gateway no longer serves /vault

grafana:
  enabled: true

prometheus:
  enabled: true

longhorn:
  enabled: true

seaweedfs:
  s3:
    enabled: true
  master:
    enabled: false
  filer:
    enabled: false
  admin:
    enabled: true

# Hubble UI — Cilium service hubble-ui.kube-system.svc.cluster.local:80 (requires hubble.ui.enabled)
hubbleUi:
  enabled: true
