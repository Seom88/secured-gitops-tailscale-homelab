ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# Per-app Tailscale Ingresses — one device per app, each served at / root.
# Hostnames: <app> prod, <app>-dev dev (via developmentApp.enabled).
# See odd/tasks/per-app-ts-ingress.md. Each Ingress lives in its app namespace.

# Per-service toggles — each controls its own Ingress (no gateway).
homepage:
  enabled: true

argocd:
  enabled: true

vault:
  enabled: true  # dedicated Ingress in namespace vault, host vault (dev: vault-dev)

grafana:
  enabled: true

prometheus:
  enabled: true

longhorn:
  enabled: true

seaweedfs:
  s3:
    enabled: true
  master:
    enabled: false
  filer:
    enabled: false
  admin:
    enabled: true

# Hubble UI — Cilium service hubble-ui.kube-system.svc.cluster.local:80 (requires hubble.ui.enabled)
hubbleUi:
  enabled: true
