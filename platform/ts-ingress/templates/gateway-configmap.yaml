# Hybrid gateway: 2 Tailscale devices — my-cluster (gateway) for 6 services + vault-my-cluster (Vault dedicated) via vault-ingress.yaml — see ADR-012 + Amendment 2026-09-02
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-gateway-nginx
  namespace: tailscale
  labels:
    app.kubernetes.io/name: cluster-gateway
    app.kubernetes.io/part-of: ts-ingress
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      server_tokens off;
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      # Upstream timeouts tuned for homelab
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      # Cilium hardening: kubeProxyReplacement=strict uses eBPF service translation,
      # L7 DNS policy may briefly delay initial resolution. All proxy_pass below
      # use variable indirection (set $upstream_* + proxy_pass http://$upstream_*:port)
      # so nginx resolves at request time via this resolver instead of getaddrinfo
      # at startup — a missing backend Service returns 502 for its prefix instead
      # of emerg/CrashLooping the whole gateway. Use FQDN
      # (kube-dns.kube-system.svc.cluster.local) not ClusterIP (10.96.0.10 drifts
      # across reinstalls). valid=10s enables TTL-based refresh; resolver_timeout
      # guards against DNS stalls. Prefix-strip locations pair the variable with
      # an explicit rewrite (^/prefix/(.*)$ /$1 break) to preserve the old
      # `proxy_pass http://host/;` URI semantics; prefix-preserving locations
      # (Grafana, Prometheus, Homepage) proxy the original URI unchanged.
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
      resolver_timeout 5s;

      # Cilium eBPF service translation benefits from HTTP/1.1 keepalive pooling.
      # Set per-location proxy_http_version 1.1 + Connection "" (Longhorn uses upgrade).

      # WebSocket support for Grafana Live (/api/live/ws) and Hubble UI
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      # Preserve original scheme from Tailscale proxy (HTTPS) when gateway listens on HTTP
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
      }

      # Trust X-Forwarded-* from Tailscale proxy
      real_ip_header X-Forwarded-For;
      set_real_ip_from 0.0.0.0/0;

      server {
        listen 80;
        server_name _;

        if ($http_x_forwarded_proto = "http") {
          return 308 https://$host$request_uri;
        }
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health probe for k8s — must be reachable via host/remote-node for Cilium probes
        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        # Homepage owns / — no root redirect (longest-prefix keeps /argocd/ etc working)

{{- if .Values.argocd.enabled }}
        # ArgoCD — backend serves at / (no basehref needed); strip /argocd prefix and rewrite HTML
        # so assets/base href stay under /argocd/. Tested: ARGOCD_SERVER_BASEHREF not reliably rewrites HTML base on v3.4.4.
        # NOTE: upstream via variable (not static proxy_pass) so nginx starts even
        # when the backend Service doesn't exist yet (e.g. monitoring OutOfSync)
        # and returns 502 for that prefix instead of CrashLooping the whole gateway.
        location /argocd/ {
          set $upstream_argocd argocd-server.argocd.svc.cluster.local;
          rewrite ^/argocd/(.*)$ /$1 break;
          proxy_pass http://$upstream_argocd:80;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /argocd;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_buffering off;
          sub_filter '<base href="/">' '<base href="/argocd/">';
          sub_filter 'href="/' 'href="/argocd/';
          sub_filter 'src="/' 'src="/argocd/';
          sub_filter 'action="/' 'action="/argocd/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /argocd {
          return 302 /argocd/;
        }
{{- end }}
{{- if .Values.grafana.enabled }}
        # Grafana — serve_from_sub_path=true, root_url=https://{{ .Values.hostname }}.lonk-mirfak.ts.net/grafana/
        # Preserve /grafana prefix — stripping (proxy_pass .../ ) causes infinite 301 loop.
        # Grafana Live uses WebSocket at /api/live/ws — requires Upgrade headers.
        location /grafana/ {
          set $upstream_grafana monitoring-grafana.monitoring.svc.cluster.local;
          proxy_pass http://$upstream_grafana:80;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /grafana;
          proxy_redirect off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location = /grafana {
          return 302 /grafana/;
        }
{{- end }}
{{- if .Values.prometheus.enabled }}
        location /prometheus/ {
          set $upstream_prometheus monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local;
          proxy_pass http://$upstream_prometheus:9090;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Prefix /prometheus;
          proxy_redirect off;
        }
        location = /prometheus {
          return 302 /prometheus/;
        }
{{- end }}
{{- if .Values.hubbleUi.enabled }}
        # Hubble UI — backend serves at / (no subpath support); strip /hubble prefix and rewrite HTML
        # like ArgoCD. Without sub_filter, browser requests /bundle.* from root and hits 404.
        location /hubble/ {
          set $upstream_hubble hubble-ui.kube-system.svc.cluster.local;
          rewrite ^/hubble/(.*)$ /$1 break;
          proxy_pass http://$upstream_hubble:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /hubble;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          sub_filter 'href="/' 'href="/hubble/';
          sub_filter 'src="/' 'src="/hubble/';
          sub_filter 'action="/' 'action="/hubble/';
          sub_filter 'url("/' 'url("/hubble/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /hubble {
          return 302 /hubble/;
        }
{{- end }}
{{- /* Vault is served via dedicated Tailscale device vault-my-cluster (vault-ingress.yaml), not via gateway — see ADR-012 Amendment */ -}}
{{- if .Values.longhorn.enabled }}
        location /longhorn/ {
          set $upstream_longhorn longhorn-frontend.longhorn-system.svc.cluster.local;
          rewrite ^/longhorn/(.*)$ /$1 break;
          proxy_pass http://$upstream_longhorn:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /longhorn;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location = /longhorn {
          return 302 /longhorn/;
        }
{{- end }}
{{- if .Values.seaweedfs.s3.enabled }}
        location /seaweedfs-s3/ {
          set $upstream_s3 seaweedfs-s3.seaweedfs.svc.cluster.local;
          rewrite ^/seaweedfs-s3/(.*)$ /$1 break;
          proxy_pass http://$upstream_s3:8333;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_redirect off;
        }
        location = /seaweedfs-s3 {
          return 302 /seaweedfs-s3/;
        }
{{- end }}
{{- if .Values.seaweedfs.admin.enabled }}
        # SeaweedFS admin redirects / → /login and serves /static/* — keep under prefix
        location /seaweedfs-admin/ {
          set $upstream_swadmin seaweedfs-admin.seaweedfs.svc.cluster.local;
          rewrite ^/seaweedfs-admin/(.*)$ /$1 break;
          proxy_pass http://$upstream_swadmin:23646;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Accept-Encoding "";
          proxy_redirect / /seaweedfs-admin/;
          proxy_redirect /login /seaweedfs-admin/login;
          sub_filter 'href="/' 'href="/seaweedfs-admin/';
          sub_filter 'src="/' 'src="/seaweedfs-admin/';
          sub_filter 'action="/' 'action="/seaweedfs-admin/';
          sub_filter 'url("/' 'url("/seaweedfs-admin/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /seaweedfs-admin {
          return 302 /seaweedfs-admin/;
        }
{{- end }}

{{- if .Values.homepage.enabled }}
        # Homepage — serves at / (root dashboard, no subpath support); preserve URI (no trailing slash).
        # Prefix location / so /api/, /_next/, etc work. Longest-prefix wins, so /argocd/ /grafana/ etc still route correctly.
        location / {
          set $upstream_homepage homepage.homepage.svc.cluster.local;
          proxy_pass http://$upstream_homepage:3000;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_redirect off;
        }
{{- else }}
        # Fallback — list available paths (Vault is on vault-my-cluster device, not here)
        location / {
          default_type text/html;
          return 404 '<h1>my-cluster gateway</h1><p>Available paths: /argocd/ /grafana/ /prometheus/ /hubble/ /longhorn/ /seaweedfs-s3/ /seaweedfs-admin/ (vault on vault-my-cluster.lonk-mirfak.ts.net)</p>';
        }
{{- end }}
      }
    }
{{- end }}
