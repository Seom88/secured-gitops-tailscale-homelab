# Hybrid gateway: 2 Tailscale devices — my-cluster (gateway) for 5 services + vault-my-cluster (Vault dedicated) via vault-ingress.yaml — see ADR-012 + Amendment 2026-09-02
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-gateway-nginx
  namespace: tailscale
  labels:
    app.kubernetes.io/name: cluster-gateway
    app.kubernetes.io/part-of: ts-ingress
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      server_tokens off;
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      # Upstream timeouts tuned for homelab
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      # Cilium hardening: kubeProxyReplacement=strict uses eBPF service translation,
      # L7 DNS policy may briefly delay initial resolution, and nginx caches DNS
      # forever via getaddrinfo at startup. Add in-cluster resolver for re-resolution
      # and periodic refresh. Use FQDN (kube-dns.kube-system.svc.cluster.local) not
      # ClusterIP (10.96.0.10 drifts across reinstalls). valid=10s enables TTL-based
      # refresh; resolver_timeout guards against DNS stalls. For true per-request
      # re-resolution, replace proxy_pass with variable indirection:
      #   set $backend "svc.namespace.svc.cluster.local";
      #   proxy_pass http://$backend:80;
      # Static proxy_pass below is kept for exact URI semantics (Grafana preserve
      # prefix, ArgoCD strip prefix + sub_filter, Longhorn websocket). Resolver is
      # still required for startup retry and for any future variable-based locations.
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
      resolver_timeout 5s;

      # Cilium eBPF service translation benefits from HTTP/1.1 keepalive pooling.
      # Set per-location proxy_http_version 1.1 + Connection "" (Longhorn uses upgrade).

      # WebSocket support for Grafana Live (/api/live/ws) and Hubble UI
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      # Preserve original scheme from Tailscale proxy (HTTPS) when gateway listens on HTTP
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
      }

      # Trust X-Forwarded-* from Tailscale proxy
      real_ip_header X-Forwarded-For;
      set_real_ip_from 0.0.0.0/0;

      server {
        listen 80;
        server_name _;

        if ($http_x_forwarded_proto = "http") {
          return 308 https://$host$request_uri;
        }
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health probe for k8s — must be reachable via host/remote-node for Cilium probes
        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location = / {
          return 302 /argocd/;
        }

{{- if .Values.argocd.enabled }}
        # ArgoCD — backend serves at / (no basehref needed); strip /argocd prefix and rewrite HTML
        # so assets/base href stay under /argocd/. Tested: ARGOCD_SERVER_BASEHREF not reliably rewrites HTML base on v3.4.4.
        location /argocd/ {
          proxy_pass http://argocd-server.argocd.svc.cluster.local:80/;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /argocd;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_buffering off;
          sub_filter '<base href="/">' '<base href="/argocd/">';
          sub_filter 'href="/' 'href="/argocd/';
          sub_filter 'src="/' 'src="/argocd/';
          sub_filter 'action="/' 'action="/argocd/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /argocd {
          return 302 /argocd/;
        }
{{- end }}
{{- if .Values.grafana.enabled }}
        # Grafana — serve_from_sub_path=true, root_url=https://{{ .Values.hostname }}.lonk-mirfak.ts.net/grafana/
        # Preserve /grafana prefix — stripping (proxy_pass .../ ) causes infinite 301 loop.
        # Grafana Live uses WebSocket at /api/live/ws — requires Upgrade headers.
        location /grafana/ {
          proxy_pass http://monitoring-grafana.monitoring.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /grafana;
          proxy_redirect off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location = /grafana {
          return 302 /grafana/;
        }
{{- end }}
{{- if .Values.prometheus.enabled }}
        location /prometheus/ {
          proxy_pass http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Prefix /prometheus;
          proxy_redirect off;
        }
        location = /prometheus {
          return 302 /prometheus/;
        }
{{- end }}
{{- if .Values.hubbleUi.enabled }}
        # Hubble UI — backend serves at / (no subpath support); strip /hubble prefix and rewrite HTML
        # like ArgoCD. Without sub_filter, browser requests /bundle.* from root and hits 404.
        location /hubble/ {
          proxy_pass http://hubble-ui.kube-system.svc.cluster.local:80/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /hubble;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          sub_filter 'href="/' 'href="/hubble/';
          sub_filter 'src="/' 'src="/hubble/';
          sub_filter 'action="/' 'action="/hubble/';
          sub_filter 'url("/' 'url("/hubble/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /hubble {
          return 302 /hubble/;
        }
{{- end }}
{{- /* Vault is served via dedicated Tailscale device vault-my-cluster (vault-ingress.yaml), not via gateway — see ADR-012 Amendment */ -}}
{{- if .Values.longhorn.enabled }}
        location /longhorn/ {
          proxy_pass http://longhorn-frontend.longhorn-system.svc.cluster.local:80/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /longhorn;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location = /longhorn {
          return 302 /longhorn/;
        }
{{- end }}
{{- if .Values.seaweedfs.s3.enabled }}
        location /seaweedfs-s3/ {
          proxy_pass http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333/;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_redirect off;
        }
        location = /seaweedfs-s3 {
          return 302 /seaweedfs-s3/;
        }
{{- end }}
{{- if .Values.seaweedfs.admin.enabled }}
        # SeaweedFS admin redirects / → /login and serves /static/* — keep under prefix
        location /seaweedfs-admin/ {
          proxy_pass http://seaweedfs-admin.seaweedfs.svc.cluster.local:23646/;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Accept-Encoding "";
          proxy_redirect / /seaweedfs-admin/;
          proxy_redirect /login /seaweedfs-admin/login;
          sub_filter 'href="/' 'href="/seaweedfs-admin/';
          sub_filter 'src="/' 'src="/seaweedfs-admin/';
          sub_filter 'action="/' 'action="/seaweedfs-admin/';
          sub_filter 'url("/' 'url("/seaweedfs-admin/';
          sub_filter_types *;
          sub_filter_once off;
        }
        location = /seaweedfs-admin {
          return 302 /seaweedfs-admin/;
        }
{{- end }}

        # Fallback — list available paths (Vault is on vault-my-cluster device, not here)
        location / {
          default_type text/html;
          return 404 '<h1>my-cluster gateway</h1><p>Available paths: /argocd/ /grafana/ /prometheus/ /hubble/ /longhorn/ /seaweedfs-s3/ /seaweedfs-admin/ (vault on vault-my-cluster.lonk-mirfak.ts.net)</p>';
        }
      }
    }
{{- end }}
