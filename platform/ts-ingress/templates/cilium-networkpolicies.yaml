{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for tailscale namespace — per-app Ingress model (ADR-018).
# Each app Ingress spawns its Tailscale proxy pod HERE (tailscale ns, label
# tailscale.com/managed=true), and the proxy forwards to the backend Service in the
# APP namespace. So this chart needs:
#   - DNS + default egress (below, all tailscale pods)
#   - proxy-egress (ts-ingress-proxy-egress): managed proxies -> backend pod IPs/ports
# App charts allow ingress FROM these managed proxies (tailscale.com/managed=true);
# kube-system (hubble-ui) has no policies, so it needs no ingress rule.
# ADR-014: Cilium v1.20.1 kubeProxyReplacement=strict enforces these strictly.

# 1) DNS egress — required for service discovery (kube-dns only, not MagicDNS 1053)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-ingress-allow-dns
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress for all pods in tailscale — DNS + kube-apiserver + Tailscale control + operator egress
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-ingress-default-egress
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Tailscale direct (WireGuard hole-punching) — peers use ephemeral high UDP ports
    # + STUN 3478/udp + DERP 443/tcp + 41641/udp. world UDP 1-65535 covers all ephemeral
    # while keeping TCP narrow (80/443 only).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "1"
              endPort: 65535
              protocol: UDP
    # ICMP Echo for Tailscale PMTU — CRD 1.33.11 requires icmps[].fields[].type (bare family is invalid)
    - toEntities:
        - world
      icmps:
      - fields:
        - family: IPv4
          type: 8
        - family: IPv4
          type: 0
        - family: IPv6
          type: 128
        - family: IPv6
          type: 129
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# 3) Proxy->backend egress — managed Tailscale proxies (tailscale.com/managed=true)
# to backend POD ports (Cilium matches post-DNAT pod ports, not Service ports).
# Without this, proxy->backend cross-namespace traffic is DROPPED (proxies only
# get kube-apiserver/world/same-ns from the default-egress above).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-ingress-proxy-egress
  namespace: tailscale
spec:
  endpointSelector:
    matchLabels:
      k8s:tailscale.com/managed: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
            - port: "23646"
              protocol: TCP
            - port: "33646"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
{{- end }}
