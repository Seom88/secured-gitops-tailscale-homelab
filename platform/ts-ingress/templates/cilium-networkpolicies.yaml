{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for tailscale namespace — per-app Ingress model (odd/tasks/per-app-ts-ingress.md).
# Each app Ingress creates its Tailscale proxy pod in the APP namespace (not here),
# so no cluster-gateway egress/ingress rules remain. Proxy->backend is same-namespace;
# add per-namespace allow rules in app charts only if hubble shows DROPPED flows.
# ADR-014: Cilium v1.20.1 kubeProxyReplacement=strict enforces these strictly.

# 1) DNS egress — required for service discovery (kube-dns only, not MagicDNS 1053)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-ingress-allow-dns
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress for all pods in tailscale — DNS + kube-apiserver + Tailscale control + operator egress
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-ingress-default-egress
  namespace: tailscale
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Tailscale direct (WireGuard hole-punching) — peers use ephemeral high UDP ports
    # + STUN 3478/udp + DERP 443/tcp + 41641/udp. world UDP 1-65535 covers all ephemeral
    # while keeping TCP narrow (80/443 only).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "1"
              endPort: 65535
              protocol: UDP
    # ICMP Echo for Tailscale PMTU — CRD 1.33.11 requires icmps[].fields[].type (bare family is invalid)
    - toEntities:
        - world
      icmps:
      - fields:
        - family: IPv4
          type: 8
        - family: IPv4
          type: 0
        - family: IPv6
          type: 128
        - family: IPv6
          type: 129
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
{{- end }}
