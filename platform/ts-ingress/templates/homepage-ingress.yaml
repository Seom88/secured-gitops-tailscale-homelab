{{- if .Values.homepage.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
  - hosts:
    - {{ if .Values.developmentApp.enabled }}homepage-dev{{ else }}homepage{{ end }}
{{- end }}
