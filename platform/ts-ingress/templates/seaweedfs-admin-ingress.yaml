{{- if .Values.seaweedfs.admin.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-admin
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-admin
                port:
                  number: 23646
  tls:
  - hosts:
    - {{ if .Values.developmentApp.enabled }}seaweedfs-admin-dev{{ else }}seaweedfs-admin{{ end }}
{{- end }}
