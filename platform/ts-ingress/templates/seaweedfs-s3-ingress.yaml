{{- if .Values.seaweedfs.s3.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3
                port:
                  number: 8333
  tls:
  - hosts:
    - {{ if .Values.developmentApp.enabled }}seaweedfs-s3-dev{{ else }}seaweedfs-s3{{ end }}
{{- end }}
