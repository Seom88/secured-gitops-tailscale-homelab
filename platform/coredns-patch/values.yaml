ciliumNetworkPolicy:
  enabled: true

# coredns-patch values — DNSConfig-driven ts.net stub for CoreDNS
dnsConfigName: ts-dns
dnsConfigPollSeconds: 120
dnsConfigPollInterval: 5
# kubectl image with shell tools; digest-pinned for reproducibility.
# Bitnami publishes only the `latest` tag for kubectl (holds kubectl 1.37.0,
# image build 2026-09-03) — the digest below is the actual pin. Refresh with
# skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
# (Renovate group `kubectl jobs` tracks tag+digest; refresh digest on tag bumps).
image:
  repository: bitnami/kubectl
  tag: "latest"
  digest: "sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492"
  pullPolicy: IfNotPresent
namespace: kube-system
coredns:
  name: coredns
  namespace: kube-system
  deployment: coredns
