ciliumNetworkPolicy:
  enabled: true

# coredns-patch values — DNSConfig-driven ts.net stub for CoreDNS
dnsConfigName: ts-dns
dnsConfigPollSeconds: 120
dnsConfigPollInterval: 5
# kubectl image with shell tools; pinned digest for reproducibility
image:
  repository: bitnami/kubectl
  tag: "latest@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492"
  pullPolicy: IfNotPresent
namespace: kube-system
coredns:
  name: coredns
  namespace: kube-system
  deployment: coredns
