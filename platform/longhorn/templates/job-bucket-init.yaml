{{- $fqdn := required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}
# Longhorn backup bucket init — idempotent create of the S3 bucket that
# longhorn.defaultBackupStore.backupTarget points at
# (s3://{{ .Values.s3.bucket }}@{{ .Values.s3.region }}/ on RustFS).
# NOTE (T-corr, live SNI evidence 2026-09-23): this Job dials
# https://<FQDN>:443 — RustFS aborts TLS unless SNI equals its LE-cert FQDN
# Credentials: bootstrap-created Secret longhorn-backup-secret
# (bootstrap/init-gitops.sh:ensureLonghornBackupCredentials(), keys
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). optional:true so the Job object
# can be created before the Secret exists; the script polls 60s.
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-bucket-init
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook-weight: "-1"
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-bucket-init
        app.kubernetes.io/component: bucket-init
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      dnsPolicy: ClusterFirst
      containers:
        - name: bucket-init
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked (regex manager
          # covers platform/*/templates). Refresh:
          # skopeo inspect docker://amazon/aws-cli:<tag> | jq -r .Digest
          image: amazon/aws-cli:2.37.0@sha256:337494c2047176fe9abcf45a5d1eaf1c2c62cae40953284fb1143b5c6170f065
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: longhorn-backup-secret
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: longhorn-backup-secret
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[bucket-init] Starting Longhorn backup bucket init (RustFS)..."
              WAIT_SECS=0
              WAIT_MAX=60
              while [ $WAIT_SECS -lt $WAIT_MAX ]; do
                if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
                  echo "[bucket-init] Credentials available."
                  break
                fi
                echo "[bucket-init] Waiting for credentials env AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY ($WAIT_SECS/$WAIT_MAX s)..."
                sleep 5
                WAIT_SECS=$((WAIT_SECS + 5))
              done
              if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
                echo "[bucket-init] ERROR: credentials not available after $WAIT_MAX s (Secret longhorn-backup-secret missing?)"
                echo "[bucket-init] Hint: ensure bootstrap/init-gitops.sh ensureLonghornBackupCredentials() ran with LONGHORN_AWS_* or AWS_*."
                exit 1
              fi
              export AWS_DEFAULT_REGION="{{ .Values.s3.region }}"
              export AWS_EC2_METADATA_DISABLED="true"
              export AWS_S3_ADDRESSING_STYLE="path"
              # Ensure aws-cli uses path-style addressing (S3 backend requires it)
              aws configure set default.s3.addressing_style path || true
              aws configure set default.s3.addressing_style path --profile default || true
              # s3-egress Service: resolve SVC_HOST, gate on the resolved
              # IPs, pin FQDN->svc-IP in /etc/hosts at runtime (below).
              S3_FQDN="{{ $fqdn }}"
              SVC_HOST="s3-egress.tailscale.svc.cluster.local"
              ENDPOINT="https://$S3_FQDN"
              S3_PORT="443"
              BUCKET="{{ .Values.s3.bucket }}"
              # Wait for the in-cluster S3 egress Service DNS to be ready
              echo "[bucket-init] Waiting for $SVC_HOST (max 120s)..."
              DNS_WAIT=0
              DNS_MAX=120
              while [ $DNS_WAIT -lt $DNS_MAX ]; do
                if nslookup "$SVC_HOST" >/dev/null 2>&1 || getent hosts "$SVC_HOST" >/dev/null 2>&1; then
                  echo "[bucket-init] DNS resolved for $SVC_HOST"
                  break
                fi
                echo "[bucket-init] DNS not yet resolved ($DNS_WAIT/$DNS_MAX s)..."
                sleep 5
                DNS_WAIT=$((DNS_WAIT + 5))
              done
              if [ $DNS_WAIT -ge $DNS_MAX ]; then
                echo "[bucket-init] WARNING: DNS still not resolved after $DNS_MAX s — one final resolution attempt below before failing fast"
              fi
              # Pre-s3api endpoint validation: log every SVC-resolved IP:port
              # BEFORE any aws call, and fail fast if any resolved IP is
              # public. Private = 10/8 (pod/service nets), 100.64/10
              is_private_ip() {
                _pip="$1"
                case "$_pip" in
                  10.*|192.168.*) return 0 ;;
                  100.*)
                    _prest="${_pip#*.}"
                    _psecond="${_prest%%.*}"
                    case "$_psecond" in ''|*[!0-9]*) return 1 ;; esac
                    if [ "$_psecond" -ge 64 ] && [ "$_psecond" -le 127 ]; then return 0; fi
                    return 1 ;;
                  fd*|FD*) return 0 ;;
                  *) return 1 ;;
                esac
              }
              RESOLVED_IPS="$( (getent hosts "$SVC_HOST" 2>/dev/null | awk '{print $1}'; nslookup "$SVC_HOST" 2>/dev/null | awk '/^Address: /{if ($2 !~ /#/) print $2} /^Address [0-9]+:/{print $3}') | sort -u | tr '\n' ' ' || true )"
              if [ -z "$(echo "$RESOLVED_IPS" | tr -d '[:space:]')" ]; then
                echo "[bucket-init] ERROR: no IP resolved for $SVC_HOST — refusing aws s3api call (check kube-dns and the s3-egress Service in namespace tailscale)"
                exit 1
              fi
              for RIP in $RESOLVED_IPS; do
                echo "[bucket-init] S3 endpoint $SVC_HOST -> $RIP:$S3_PORT"
                if is_private_ip "$RIP"; then
                  echo "[bucket-init] $RIP is private (10/8, 100.64/10, 192.168/16, fd00::/8) — OK"
                else
                  echo "[bucket-init] ERROR: refusing S3 dial — $RIP is PUBLIC (outside 10/8, 100.64/10, 192.168/16, fd00::/8); expected the tailscale s3-egress ClusterIP/proxy, not MagicDNS public fallback"
                  if command -v openssl >/dev/null 2>&1; then
                    echo "[bucket-init] TLS diagnostic (best-effort): openssl s_client -connect $RIP:$S3_PORT -servername $S3_FQDN"
                    if command -v timeout >/dev/null 2>&1; then
                      timeout 10 openssl s_client -connect "$RIP:$S3_PORT" -servername "$S3_FQDN" </dev/null 2>&1 | head -20 || true
                    else
                      openssl s_client -connect "$RIP:$S3_PORT" -servername "$S3_FQDN" </dev/null 2>&1 | head -20 || true
                    fi
                  else
                    echo "[bucket-init] openssl not available — skipping TLS diagnostic"
                  fi
                  exit 1
                fi
              done
              # SNI fix: pin the LE-cert FQDN to the in-cluster svc IPs
              # resolved above — runtime /etc/hosts entries, never static
              for RIP in $RESOLVED_IPS; do
                echo "[bucket-init] hosts-pin: $RIP $S3_FQDN"
                echo "$RIP $S3_FQDN" >> /etc/hosts
              done
              echo "[bucket-init] hosts-pin lines:"
              grep -F "$S3_FQDN" /etc/hosts || true

              echo "[bucket-init] Creating bucket $BUCKET at $ENDPOINT (region $AWS_DEFAULT_REGION)..."

              # RustFS serves a public Let's Encrypt cert for $S3_FQDN, but
              # --no-verify-ssl is retained (robustness across rotations).

              set +e
              OUTPUT="$(aws --no-verify-ssl s3api create-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" 2>&1)"
              RC=$?
              set -e
              echo "$OUTPUT"
              if [ $RC -eq 0 ]; then
                echo "[bucket-init] Bucket created successfully."
              else
                if echo "$OUTPUT" | grep -qiE 'BucketAlreadyOwnedByYou|BucketAlreadyExists|already exists'; then
                  echo "[bucket-init] Bucket already exists — continuing (idempotent)."
                elif echo "$OUTPUT" | grep -qiE 'AccessDenied'; then
                  echo "[bucket-init] AccessDenied on create-bucket — checking if bucket already exists and is accessible..."
                  if aws --no-verify-ssl s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" 2>/dev/null; then
                    echo "[bucket-init] Bucket exists and is accessible — continuing (pre-created, key lacks s3:CreateBucket)."
                  else
                    echo "[bucket-init] ERROR: create-bucket denied AND bucket not accessible — grant s3:CreateBucket on arn:aws:s3:::$BUCKET (see docs/rustfs-iam.md) or pre-create the bucket."
                    exit $RC
                  fi
                else
                  echo "[bucket-init] ERROR: create-bucket failed with exit $RC"
                  exit $RC
                fi
              fi

              echo "[bucket-init] Verifying bucket with head-bucket..."
              aws --no-verify-ssl s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"
              echo "[bucket-init] Verification OK — bucket $BUCKET is accessible."
              aws --no-verify-ssl s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" || true
              echo "[bucket-init] Done."
