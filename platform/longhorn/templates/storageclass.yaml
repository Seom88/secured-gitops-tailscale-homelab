# Additional StorageClass for Longhorn volumes
# Deployed by the App-of-Apps as part of the platform/longhorn chart (wave 0)
# Longhorn's default StorageClass (created by the Helm chart) handles most cases.
# This one exists for volumes that need explicit Retain + SSD/NVME diskSelector.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  diskSelector: "" # virtio homelab: no ssd/nvme tags, selector cleared
  migratable: "true"

---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-encrypted
  annotations:
    argocd.argoproj.io/sync-options: Replace=true # parameters are immutable; allow replace on replica/size changes
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2" # was 3: 100Gi x3 never schedules on 161GB homelab disks; 2 x 30Gi fits
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: "longhorn-crypto"
  csi.storage.k8s.io/provisioner-secret-namespace: "longhorn-system"
  csi.storage.k8s.io/node-publish-secret-name: "longhorn-crypto"
  csi.storage.k8s.io/node-publish-secret-namespace: "longhorn-system"
  csi.storage.k8s.io/node-stage-secret-name: "longhorn-crypto"
  csi.storage.k8s.io/node-stage-secret-namespace: "longhorn-system"
  csi.storage.k8s.io/node-expand-secret-name: "longhorn-crypto"
  csi.storage.k8s.io/node-expand-secret-namespace: "longhorn-system"