ciliumNetworkPolicy:
  enabled: true

longhorn:
  defaultSettings:
    defaultReplicaCount: 1
    replicaAutoBalance: "disabled"
    # Dev sizing: full upstream engine reservation so rebuilds are never
    # starved while testing; prod stays lean. No CPU limit on engines.
    guaranteedInstanceManagerCPU: '{"v1":"12","v2":"12"}'
  persistence:
    defaultClassReplicaCount: 1
