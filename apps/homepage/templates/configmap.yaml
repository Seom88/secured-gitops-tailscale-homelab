apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/Seom88
              icon: github
              description: My repositories, stars and code
  services.yaml: |
    - GitOps & Security:
        - Argo CD:
            icon: argocd
            href: https://my-cluster.lonk-mirfak.ts.net/argocd
            description: GitOps deployments, sync status and app history
        - Vault:
            icon: vault
            href: https://vault-my-cluster.lonk-mirfak.ts.net
            description: Secrets, tokens and encryption key management
    - Observability:
        - Grafana:
            icon: grafana
            href: https://my-cluster.lonk-mirfak.ts.net/grafana
            description: Dashboards for metrics, logs and cluster health
        - Prometheus:
            icon: prometheus
            href: https://my-cluster.lonk-mirfak.ts.net/prometheus
            description: Metrics collection, queries and alert rules
        - Hubble:
            icon: cilium
            href: https://my-cluster.lonk-mirfak.ts.net/hubble
            description: Network flows, service map and policy visibility
    - Storage:
        - Longhorn:
            icon: longhorn
            href: https://my-cluster.lonk-mirfak.ts.net/longhorn
            description: Block storage, volumes, snapshots and backups
        - SeaweedFS Admin:
            icon: seaweedfs
            href: https://my-cluster.lonk-mirfak.ts.net/seaweedfs-admin
            description: S3 object storage, buckets, volumes and filer
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
