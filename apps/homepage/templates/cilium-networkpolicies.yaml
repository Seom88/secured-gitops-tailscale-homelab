{{- if .Values.ciliumNetworkPolicy.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-allow-dns
  namespace: homepage
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-allow-egress
  namespace: homepage
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-allow-ingress
  namespace: homepage
spec:
  endpointSelector: {}
  ingress:
    # Per-app Tailscale Ingress proxy (ADR-018): proxy pods run in tailscale ns
    # with label tailscale.com/managed=true (not the deleted cluster-gateway)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            k8s:tailscale.com/managed: "true"
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
{{- end }}
