{{- if .Values.backup.enabled }}
# CloudNativePG Barman backup store for Immich (immich-seaweedfs-backups).
# Uses the plugin-barman-cloud API: barmancloud.cnpg.io/v1 ObjectStore,
# WAL archiving via Cluster .spec.plugins, declarative backups with
# method: plugin. Local wave 1: after the backup-init hook (wave 0).
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-backup-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  configuration:
    destinationPath: s3://{{ .Values.backup.bucket }}/
    endpointURL: {{ .Values.backup.endpoint }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.secretName }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.backup.secretName }}
        key: SECRET_ACCESS_KEY
  # Recovery-window retention; see values.yaml for why this is "3d".
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-database-daily
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: immich-database
  schedule: {{ .Values.backup.schedule | quote }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
