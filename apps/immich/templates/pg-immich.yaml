apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  monitoring:
    enablePodMonitor: true
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
    synchronous:
      method: any
      number: 1
    
    
  bootstrap:
    initdb:
      database: immich
      owner: immich
  # If you wanna reuse a secret, you can uncomment the following lines and set the name of the secret to use. 
  #     secret:
  #       name: immich-secret

  storage:
    size: 2Gi # fresh DB measured ~130Mi (2026-09-22); photos live in library PVC, not here
