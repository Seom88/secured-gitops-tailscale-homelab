{{- if .Values.backup.enabled }}
# Least-privilege RBAC for the backup-init Sync hook (immich-seaweedfs-backups).
# Local wave -1: before the hook (wave 0). The hook's ServiceAccount may only:
# - read the static SeaweedFS S3 config Secret (admin creds for provisioning);
# - read/create/update (never delete) its own credentials Secret. Update covers
#   only the keyless-Secret replace path; usable credentials are never touched.
# It never touches the SOPS-owned static Secret's contents.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-backup-init
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-backup-init
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # create cannot be name-scoped: resourceNames never match create because the
  # object name does not exist yet at admission, so a name-scoped create rule
  # would always yield 403 "cannot create resource secrets".
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.backup.secretName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-backup-init
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: immich-backup-init
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: immich-backup-init
  apiGroup: rbac.authorization.k8s.io
---
# Read-only access to the static SeaweedFS S3 config (lives in seaweedfs ns).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-backup-init-provisioner
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["seaweedfs-s3-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-backup-init-provisioner
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: immich-backup-init
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: immich-backup-init-provisioner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
