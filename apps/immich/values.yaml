ciliumNetworkPolicy:
  enabled: false

developmentApp:
  enabled: false

immich:
  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
  server:
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: host } }
              DB_USERNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: username } }
              DB_PASSWORD:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: password } }
              DB_DATABASE_NAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: dbname } }
  valkey:
    enabled: true

tailscaleIngress:
  immich:
    enabled: true
    hostname: immich
