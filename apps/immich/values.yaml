ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

immich:
  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
  server:
    controllers:
      main:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                      app.kubernetes.io/name: machine-learning
                      app.kubernetes.io/controller: main
                  topologyKey: kubernetes.io/hostname
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: host } }
              DB_USERNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: username } }
              DB_PASSWORD:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: password } }
              DB_DATABASE_NAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: dbname } }
  machine-learning:
    controllers:
      main:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                      app.kubernetes.io/name: server
                      app.kubernetes.io/controller: main
                  topologyKey: kubernetes.io/hostname
  valkey:
    enabled: true

tailscaleIngress:
  immich:
    enabled: true
    hostname: immich
