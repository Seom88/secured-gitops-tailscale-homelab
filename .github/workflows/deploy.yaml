# Deploy GitOps — fetches kubeconfig from infra state, runs bootstrap/init-gitops.sh
name: Deploy GitOps

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, dev]
        default: prod
      force_reapply:
        description: Force reapply even if App-of-Apps already exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HELM_VERSION: v3.18.4
  # Single source of truth: GitHub Vars (S3_ENDPOINT, S3_BUCKET). NO fallbacks —
  # empty vars fail fast in the "Validate S3 configuration" step below.
  # S3_ENDPOINT must be the full URL (https://<fqdn>); init-gitops.sh derives the
  # bare FQDN for Velero s3.tailnetFqdn from it.
  # NOTE: S3_BUCKET here is the Terraform-state bucket, NOT the Velero bucket
  # (velero-homelab is chart-owned in platform/velero/values.yaml).
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'prod' }}

    steps:
      - name: Checkout secure repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout infra repo (for kubeconfig)
        uses: actions/checkout@v7
        with:
          repository: Seom88/infra-talos-homelab
          path: infra
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Validate S3 configuration (fail fast)
        run: |
          fail=0
          if [ -z "$S3_ENDPOINT" ]; then
            echo "::error::S3_ENDPOINT is empty — set GitHub repository/environment Var S3_ENDPOINT (e.g. https://rustfs.<tailnet>.ts.net)"
            fail=1
          else
            case "$S3_ENDPOINT" in
              https://*) ;;
              *)
                echo "::error::S3_ENDPOINT must start with https:// (full URL, e.g. https://rustfs.<tailnet>.ts.net)"
                fail=1
                ;;
            esac
          fi
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::S3_BUCKET is empty — set GitHub repository/environment Var S3_BUCKET (Terraform-state bucket)"
            fail=1
          fi
          exit $fail

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Helm (${{ env.HELM_VERSION }})
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install jq / yq (if needed)
        run: |
          jq --version
          if ! command -v yq >/dev/null 2>&1; then
            echo "Installing yq..."
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
          use-cache: 'true'

      - name: Restore kubeconfig from infra state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          ENV="${{ inputs.environment || 'prod' }}"
          echo "Target environment: $ENV"
          TF_DIR="infra/environments/proxmox/${ENV}"

          if [ ! -d "$TF_DIR" ]; then
            echo "::error::Terraform env dir not found: $TF_DIR"
            ls -R infra/environments 2>&1 | head -n 80
            exit 1
          fi

          echo "→ terraform init -reconfigure ($TF_DIR)"
          terraform -chdir="$TF_DIR" init -reconfigure -input=false

          echo "→ terraform output -raw kubeconfig"
          if terraform -chdir="$TF_DIR" output -raw kubeconfig > /tmp/kubeconfig.yaml 2>/dev/null; then
            echo "kubeconfig obtained via terraform output"
          else
            echo "::warning::terraform output failed — trying S3 fallback"
            if command -v aws >/dev/null 2>&1; then
              echo "Attempting aws s3api fallback..."
              aws s3api get-object \
                --bucket ${{ env.S3_BUCKET }} \
                --key "proxmox/${ENV}/terraform.tfstate" \
                --endpoint-url ${{ env.S3_ENDPOINT }} \
                /tmp/tfstate.json 2>&1 || echo "S3 get-object failed"
              if [ -f /tmp/tfstate.json ]; then
                jq -r '.outputs.kubeconfig.value // empty' /tmp/tfstate.json > /tmp/kubeconfig.yaml 2>/dev/null || true
                rm -f /tmp/tfstate.json
              fi
            else
              echo "aws cli not available for fallback"
            fi
          fi

          if [ ! -s /tmp/kubeconfig.yaml ]; then
            echo "::error::kubeconfig is missing or empty after all methods (/tmp/kubeconfig.yaml)"
            ls -l /tmp/kubeconfig.yaml 2>&1 || true
            exit 1
          fi

          chmod 600 /tmp/kubeconfig.yaml
          echo "KUBECONFIG=/tmp/kubeconfig.yaml"
          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> "$GITHUB_ENV"

          echo "→ kubectl cluster-info"
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl cluster-info --request-timeout=10s
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl get nodes --request-timeout=10s || echo "::warning::kubectl get nodes failed — cluster may still be initializing"

      - name: Ensure Tailscale Operator Secret
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
        run: |
          set -e
          echo "Ensuring namespace tailscale and Secret operator-oauth..."
          kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic operator-oauth \
            -n tailscale \
            --from-literal=client_id="${{ secrets.K8S_TS_OAUTH_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.K8S_TS_OAUTH_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Tailscale Secret applied — restarting operator to pick up rotation..."
          kubectl rollout restart deployment/tailscale-operator -n tailscale 2>/dev/null || \
            kubectl rollout restart deployment/operator -n tailscale 2>/dev/null || true
          echo "Tailscale operator Secret ready."

      - name: Ensure Velero S3 ConfigMap
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
        run: |
          set -e
          # CI-owned ConfigMap velero/s3-endpoint (informational mirror of the
          # S3 endpoint; the chart does NOT template it).
          # Same derivation as bootstrap/init-gitops.sh resolveS3Endpoint():
          # $S3_ENDPOINT (GitHub Vars, full https:// URL) -> bare FQDN.
          # Keys tailnet-fqdn, s3-url, bucket, region; bucket/region mirror the
          # chart-owned s3.* constants in platform/velero/values.yaml.
          # S3_ENDPOINT was already validated (non-empty, https:// prefix) by
          # the "Validate S3 configuration" step.
          # S3_BUCKET is the Terraform-state bucket, NOT Velero's — never wired here.
          S3_FQDN="${S3_ENDPOINT#https://}"
          S3_FQDN="${S3_FQDN%%/*}"
          if [ -z "$S3_FQDN" ]; then
            echo "::error::could not derive FQDN from S3_ENDPOINT"
            exit 1
          fi
          S3_URL="https://$S3_FQDN"
          echo "Ensuring ConfigMap velero/s3-endpoint ($S3_URL)..."
          kubectl create namespace velero --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap s3-endpoint \
            -n velero \
            --from-literal=tailnet-fqdn="$S3_FQDN" \
            --from-literal=s3-url="$S3_URL" \
            --from-literal=bucket="velero-homelab" \
            --from-literal=region="us-east-1" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Velero S3 ConfigMap ready."

      - name: Bootstrap (delegates to init-gitops.sh — single source of truth)
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
          S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VELERO_AWS_ACCESS_KEY_ID: ${{ secrets.VELERO_AWS_ACCESS_KEY_ID }}
          VELERO_AWS_SECRET_ACCESS_KEY: ${{ secrets.VELERO_AWS_SECRET_ACCESS_KEY }}
          K8S_TS_OAUTH_CLIENT_ID: ${{ secrets.K8S_TS_OAUTH_CLIENT_ID }}
          K8S_TS_OAUTH_SECRET: ${{ secrets.K8S_TS_OAUTH_SECRET }}
        run: |
          set -e
          ENV="${{ inputs.environment || 'prod' }}"
          FORCE=""
          if [ "${{ inputs.force_reapply || false }}" = "true" ]; then
            FORCE="--force"
            echo "force_reapply=true → will pass --force to init-gitops.sh"
          fi

          chmod +x bootstrap/init-gitops.sh
          ./bootstrap/init-gitops.sh "$ENV" $FORCE

      - name: Cleanup kubeconfig
        if: always()
        run: |
          shred -u /tmp/kubeconfig.yaml 2>/dev/null || rm -f /tmp/kubeconfig.yaml /tmp/tfstate.json 2>/dev/null || true
          echo "Kubeconfig cleaned"
