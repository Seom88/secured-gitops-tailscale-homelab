# Deploy GitOps — fetches kubeconfig from infra state, runs bootstrap/init-gitops.sh
name: Deploy GitOps

on:
  workflow_run:
    workflows: ["Validate", "Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, dev]
        default: prod
      force_reapply:
        description: Force reapply even if App-of-Apps already exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HELM_VERSION: v4.3.0
  # GitHub Vars (S3_ENDPOINT, S3_BUCKET) serve Terraform-state access only
  # (kubeconfig restore + state fallback). NO fallbacks for Velero here —
  # the Velero endpoint is a git literal (gitops/values.yaml veleroS3.tailnetFqdn).
  # S3_ENDPOINT must be the full URL (https://<fqdn>) of the RustFS host.
  # NOTE: S3_BUCKET here is the Terraform-state bucket, NOT the Velero bucket
  # (velero-homelab is chart-owned in platform/velero/values.yaml).
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}

jobs:
  # Fail-closed gate: auto-deploy only when BOTH Validate and Security are
  # green on the head SHA. The gate re-runs on every completion of either
  # workflow, so the first finisher waits (gate fails, no deploy) and the
  # second finisher opens the gate — no polling needed. Non-push events
  # (e.g. the weekly Security cron) and manual dispatches skip the gate:
  # cron must never deploy, dispatch is an explicit operator action.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require Validate + Security green on head SHA
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          echo "Head SHA: $SHA (triggered by ${{ github.event.workflow_run.name }})"
          runs="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&event=push&per_page=50" --jq '.workflow_runs')"
          fail=0
          for wf in Validate Security; do
            concl="$(printf '%s' "$runs" | jq -r --arg wf "$wf" '[.[] | select(.name==$wf and .status=="completed")] | sort_by(.updated_at) | last | .conclusion // "missing"')"
            echo "$wf: $concl"
            if [ "$concl" != "success" ]; then fail=1; fi
          done
          if [ "$fail" != "0" ]; then
            echo "::error::gate closed — waiting for both Validate and Security to succeed on $SHA (this run was triggered by the first finisher; the second finisher re-opens the gate)"
            exit 1
          fi
          echo "Gate open — both workflows green on $SHA"

  deploy:
    needs: [gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'prod' }}

    steps:
      - name: Checkout secure repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout infra repo (for kubeconfig)
        uses: actions/checkout@v7
        with:
          repository: Seom88/infra-talos-homelab
          path: infra
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Validate S3 configuration (fail fast)
        run: |
          fail=0
          if [ -z "$S3_ENDPOINT" ]; then
            echo "::error::S3_ENDPOINT is empty — set GitHub repository/environment Var S3_ENDPOINT (e.g. https://rustfs.<tailnet>.ts.net)"
            fail=1
          else
            case "$S3_ENDPOINT" in
              https://*) ;;
              *)
                echo "::error::S3_ENDPOINT must start with https:// (full URL, e.g. https://rustfs.<tailnet>.ts.net)"
                fail=1
                ;;
            esac
          fi
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::S3_BUCKET is empty — set GitHub repository/environment Var S3_BUCKET (Terraform-state bucket)"
            fail=1
          fi
          exit $fail

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Helm (${{ env.HELM_VERSION }})
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install jq / yq (if needed)
        run: |
          jq --version
          if ! command -v yq >/dev/null 2>&1; then
            echo "Installing yq..."
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Install sops (if needed)
        run: |
          if ! command -v sops >/dev/null 2>&1; then
            SOPS_VERSION="v3.10.2"
            curl -sLo /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
            sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          fi
          sops --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
          use-cache: 'true'

      - name: Restore kubeconfig from infra state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_S3: ${{ env.S3_ENDPOINT }}
          AWS_S3_FORCE_PATH_STYLE: "true"
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -e
          ENV="${{ inputs.environment || 'prod' }}"
          echo "Target environment: $ENV"
          TF_DIR="infra/environments/proxmox/${ENV}"

          if [ ! -d "$TF_DIR" ]; then
            echo "::error::Terraform env dir not found: $TF_DIR"
            ls -R infra/environments 2>&1 | head -n 80
            exit 1
          fi

          echo "→ terraform init -reconfigure ($TF_DIR)"
          terraform -chdir="$TF_DIR" init -reconfigure -input=false \
            -backend-config="endpoint=${{ env.S3_ENDPOINT }}" \
            -backend-config="skip_s3_checksum=true"

          echo "→ terraform output -raw kubeconfig"
          if terraform -chdir="$TF_DIR" output -raw kubeconfig > /tmp/kubeconfig.yaml 2>/dev/null; then
            echo "kubeconfig obtained via terraform output"
          else
            echo "::warning::terraform output failed — trying S3 fallback"
            if command -v aws >/dev/null 2>&1; then
              echo "Attempting aws s3api fallback..."
              aws s3api get-object \
                --bucket ${{ env.S3_BUCKET }} \
                --key "proxmox/${ENV}/terraform.tfstate" \
                --endpoint-url ${{ env.S3_ENDPOINT }} \
                --region us-east-1 \
                /tmp/tfstate.json 2>&1 || echo "S3 get-object failed"
              if [ -f /tmp/tfstate.json ]; then
                jq -r '.outputs.kubeconfig.value // empty' /tmp/tfstate.json > /tmp/kubeconfig.yaml 2>/dev/null || true
                rm -f /tmp/tfstate.json
              fi
            else
              echo "aws cli not available for fallback"
            fi
          fi

          if [ ! -s /tmp/kubeconfig.yaml ]; then
            echo "::error::kubeconfig is missing or empty after all methods (/tmp/kubeconfig.yaml)"
            ls -l /tmp/kubeconfig.yaml 2>&1 || true
            exit 1
          fi

          chmod 600 /tmp/kubeconfig.yaml
          echo "KUBECONFIG=/tmp/kubeconfig.yaml"
          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> "$GITHUB_ENV"

          echo "→ kubectl cluster-info"
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl cluster-info --request-timeout=10s
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl get nodes --request-timeout=10s || echo "::warning::kubectl get nodes failed — cluster may still be initializing"

      - name: Ensure Tailscale Operator Secret
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
        run: |
          set -e
          echo "Ensuring namespace tailscale and Secret operator-oauth..."
          kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic operator-oauth \
            -n tailscale \
            --from-literal=client_id="${{ secrets.K8S_TS_OAUTH_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.K8S_TS_OAUTH_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Tailscale Secret applied — restarting operator to pick up rotation..."
          kubectl rollout restart deployment/tailscale-operator -n tailscale 2>/dev/null || \
            kubectl rollout restart deployment/operator -n tailscale 2>/dev/null || true
          echo "Tailscale operator Secret ready."

      - name: Restore SOPS age key and apply encrypted secrets
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_S3: ${{ env.S3_ENDPOINT }}
          AWS_S3_FORCE_PATH_STYLE: "true"
          AWS_EC2_METADATA_DISABLED: "true"
          SOPS_AGE_KEY_FILE: /tmp/age-keys.txt
        run: |
          chmod +x bootstrap/init-sops.sh
          ./bootstrap/init-sops.sh 

      - name: Bootstrap (delegates to init-gitops.sh — single source of truth)
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VELERO_AWS_ACCESS_KEY_ID: ${{ secrets.VELERO_AWS_ACCESS_KEY_ID }}
          VELERO_AWS_SECRET_ACCESS_KEY: ${{ secrets.VELERO_AWS_SECRET_ACCESS_KEY }}
          K8S_TS_OAUTH_CLIENT_ID: ${{ secrets.K8S_TS_OAUTH_CLIENT_ID }}
          K8S_TS_OAUTH_SECRET: ${{ secrets.K8S_TS_OAUTH_SECRET }}
        run: |
          set -e
          ENV="${{ inputs.environment || 'prod' }}"
          FORCE=""
          if [ "${{ inputs.force_reapply || false }}" = "true" ]; then
            FORCE="--force"
            echo "force_reapply=true → will pass --force to init-gitops.sh"
          fi

          chmod +x bootstrap/init-gitops.sh
          ./bootstrap/init-gitops.sh "$ENV" $FORCE

      - name: Cleanup kubeconfig
        if: always()
        run: |
          shred -u /tmp/kubeconfig.yaml 2>/dev/null || rm -f /tmp/kubeconfig.yaml /tmp/tfstate.json 2>/dev/null || true
          echo "Kubeconfig cleaned"
