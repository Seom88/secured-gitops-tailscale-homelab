# Pre-commit — fast local checks. Install once: `pre-commit install`.
# detect-secrets is baseline-gated (never auto-update the baseline — audit
# false positives with `detect-secrets audit .secrets.baseline`). check-yaml /
# check-json replace the old custom sanity loops for staged files; yamllint and
# shellcheck mirror the CI validate job. Renovate's `pre-commit` manager bumps
# these revs automatically.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^platform/.*/Chart\.lock$|.*\.enc\.yaml$|\.sops\.yaml$'
  - repo: local
    hooks:
      # Mirrors CI `Inline image convention`: split `repository:` + `tag:` blocks
      # in values files are invisible to Renovate Manager 1 — fail fast locally.
      # grep only, no network, runs only when a values file is staged.
      - id: inline-image-convention
        name: 'inline image convention (no split repository in values files)'
        entry: >-
          bash -c
          'matches="$(grep -rn --include="values*.yaml" -E "^[[:space:]]*repository[[:space:]]*:" platform/ apps/ gitops/ || true)";
          if [ -n "$matches" ]; then echo "split-style image blocks found in values files (use inline image instead):";
          printf "%s\n" "$matches"; exit 1; fi;
          echo "Inline image convention: OK"'
        language: system
        files: 'values.*\.ya?ml$'
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Helm templates contain Go sprig ({{ }}) — not valid YAML. helm lint owns them.
      # Note: `gitops/templates/` (root-level chart templates) needs its own
      # alternative — `(platform|apps|gitops)/.*/templates/` only matches nested paths.
      - id: check-yaml
        exclude: ^(platform/longhorn/charts/|(platform|apps|gitops)/.*/templates/|gitops/templates/)
      - id: check-json
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        exclude: ^(platform/longhorn/charts/|(platform|apps|gitops)/.*/templates/|gitops/templates/)
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
