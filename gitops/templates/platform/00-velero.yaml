{{- if .Values.platformApps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    wave-policy: healthy
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ if .Values.developmentApp.enabled }}dev{{ else }}main{{ end }}
    path: platform/velero
    helm:
      ignoreMissingValueFiles: true
      valueFiles:
        - values.yaml
        {{- if .Values.developmentApp.enabled }}
        - values-dev.yaml
        {{- end }}
      # S3 endpoint parameter — single source: CI GitHub Vars S3_ENDPOINT
      # (init-gitops.sh --set veleroS3.tailnetFqdn). `required` fails the sync
      # loudly instead of deploying a stale hardcoded URL. One parameter is
      # enough: Service, bucket-init Job, CiliumNetworkPolicy and the
      # wrapper-owned BackupStorageLocation all derive from s3.tailnetFqdn.
      # (The informational ConfigMap velero/s3-endpoint is CI-owned,
      # created by .github/workflows/deploy.yaml — not templated here.)
      parameters:
        - name: s3.tailnetFqdn
          value: {{ required "veleroS3.tailnetFqdn is required (CI: --set veleroS3.tailnetFqdn from S3_ENDPOINT)" .Values.veleroS3.tailnetFqdn | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  ignoreDifferences:
  - group: batch
    kind: Job
    namespace: velero
    jsonPointers:
    - /spec/selector
    - /spec/template/metadata/labels
    - /spec/template/metadata/annotations
  - group: ""
    kind: Service
    name: s3-egress
    namespace: velero
    jsonPointers:
    - /spec/type
    - /spec/externalName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - Retry=true
{{- end }}
