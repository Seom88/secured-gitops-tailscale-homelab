# App-of-Apps chart values — ordered core is plain Applications in templates/apps/ (see ADR-006)
repoURL: https://github.com/Seom88/secured-gitops-tailscale-homelab.git
platformApps:
  enabled: true

# Same single source as prod: literal in git (see values.yaml).
# No fallback anywhere — `required` fails loudly on drift.
sharedS3:
  tailnetFqdn: "rustfs.lonk-mirfak.ts.net"

developmentApp:
  enabled: true

vault:
  enabled: false

eso:
  enabled: false
